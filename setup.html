<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตั้งค่า POS</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17212b;font:16px Tahoma,"Leelawadee UI",sans-serif;padding:34px}.box{max-width:540px;margin:0 auto;background:white;border:1px solid #e3e7eb;border-radius:18px;padding:28px;box-shadow:0 10px 35px #1b30221a}h1{font-size:24px;margin:0 0 8px}.muted{color:#6d7a83;line-height:1.6}.choice{width:100%;text-align:left;background:#f1f7f4;border:1px solid #dce9e3;padding:16px;border-radius:12px;margin:10px 0;color:#173b35;cursor:pointer;font:inherit}.choice b{display:block;margin-bottom:5px}.client{display:none;border-top:1px solid #e7ece9;margin-top:18px;padding-top:16px}input{width:100%;padding:13px;border:1px solid #cbd6d2;border-radius:9px;font:inherit;margin:8px 0 12px}.primary{background:#18836c;color:white;border:0;padding:12px 18px;border-radius:9px;font:inherit;cursor:pointer}#error{color:#a33;min-height:24px;font-size:13px}.small{font-size:12px;color:#78848d}</style></head><body><main class="box"><h1>ตั้งค่าเครื่อง POS</h1><p class="muted">เลือกว่าจะเก็บฐานข้อมูลไว้ที่เครื่องนี้ หรือเชื่อมกับเครื่อง POS หลักใน Wi-Fi</p><button class="choice" onclick="host()"><b>เครื่องหลัก · เก็บฐานข้อมูล</b><span class="small">เลือกหนึ่งเครื่องในร้านให้เปิดแอปไว้ตลอดเวลาทำการ</span></button><button class="choice" onclick="showClient()"><b>เครื่องเชื่อมต่อ · ใช้ฐานข้อมูลร่วมกัน</b><span class="small">กรอก IP ที่หน้า “เชื่อมเครื่องอื่นผ่าน Wi-Fi” บนเครื่องหลักแสดงไว้</span></button><section id="client" class="client"><label>IP หรือ URL ของเครื่องหลัก<input id="address" placeholder="เช่น 192.168.1.10"></label><button class="primary" onclick="connect()">เชื่อมต่อและเปิด POS</button></section><p id="error"></p></main><script>function showClient(){document.getElementById('client').style.display='block';document.getElementById('address').focus()}async function host(){document.getElementById('error').textContent='กำลังเริ่มฐานข้อมูลบนเครื่องนี้…';await window.posSetup.chooseHost()}async function connect(){let result=await window.posSetup.connect(document.getElementById('address').value);if(!result.ok) document.getElementById('error').textContent=result.message}</script></body></html>
